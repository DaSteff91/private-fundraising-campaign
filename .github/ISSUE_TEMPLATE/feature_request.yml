name: Feature request
description: Suggest an improvement to the template
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for operators or contributors?
      placeholder: As an adopter / contributor, I need…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What change would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, mockups, or related issues (optional).
